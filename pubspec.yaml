name: merope
description: "Merope: High-Performance, Modular, Offline-First Real-Time Communication Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  riverpod_annotation: ^2.3.5

  # Local Storage & Database (Offline-First)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Networking & Real-Time Communication
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  grpc: ^3.2.0
  protobuf: ^3.1.0

  # Media & RTC
  flutter_webrtc: ^0.10.7
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_linux: ^1.0.0

  # Custom Packages
  merope_ads:
    path: packages/merope_ads
  merope_core:
    path: packages/merope_core
  merope_models:
    path: packages/merope_models
  merope_ui:
    path: packages/merope_ui

  # Data & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0

  # Security & Cryptography
  crypto: ^3.0.3
  argon2: ^1.0.1
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  flutter_windowmanager: ^0.2.0

  # UI, Custom Styling & Utilities
  flutter_svg: ^2.0.10+1
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  collection: ^1.18.0
  flutter_staggered_grid_view: ^0.7.0
  emoji_picker_flutter: ^1.6.3
  giphy_get: ^3.6.1+1
  lottie: ^3.1.2
  confetti: ^0.7.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  flutter_blurhash: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
