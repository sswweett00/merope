name: Temporary ClickHouse Dependency Updater

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-clickhouse-dependency-updater
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Upgrade ClickHouse driver compatibility
        run: |
          go get github.com/ClickHouse/clickhouse-go/v2@v2.48.0
          go get github.com/moby/go-archive@v0.3.0
          go mod tidy
          go mod verify
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "No dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "security: align ClickHouse dependencies"
          git push
