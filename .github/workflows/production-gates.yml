name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      - name: Capture generated checksum file
        uses: actions/upload-artifact@v4
        with:
          name: generated-go-sum
          path: backend/go.sum
          if-no-files-found: error
          retention-days: 1
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api/...
