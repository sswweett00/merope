name: Temporary Go Dependency Updater

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-go-dependency-updater
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Upgrade security-patched dependencies
        run: |
          go get             github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3             github.com/ClickHouse/ch-go@v0.65.0             github.com/gofiber/fiber/v2@v2.52.12             github.com/jackc/pgx/v5@v5.9.2             go.opentelemetry.io/otel@v1.41.0             go.opentelemetry.io/otel/sdk@v1.41.0             go.opentelemetry.io/otel/trace@v1.41.0             golang.org/x/net@v0.51.0             golang.org/x/text@v0.39.0             google.golang.org/grpc@v1.83.2
          go mod tidy
      - name: Verify module graph
        run: |
          go mod verify
          go list -m all >/dev/null
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "No dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "security: update vulnerable Go dependencies"
          git push
