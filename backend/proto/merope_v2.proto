syntax = "proto3";

package merope.v2;

option go_package = "merope-backend/proto/v2";

// Identity & Auth
service IdentityService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc ValidatePasskey (PasskeyRequest) returns (AuthResponse);
}

// Social Graph
service SocialService {
  rpc Follow (RelationRequest) returns (ActionResponse);
  rpc Unfollow (RelationRequest) returns (ActionResponse);
  rpc GetMutuals (UserQuery) returns (UserListResponse);
}

// Content & Feed
service ContentService {
  rpc CreatePost (PostRequest) returns (PostResponse);
  rpc GetFeed (FeedRequest) returns (FeedResponse);
  rpc AddReaction (ReactionRequest) returns (ActionResponse);
}

// Real-time Sync
service RealtimeService {
  rpc ConnectStream (ConnectRequest) returns (stream ServerEvent);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string identifier = 1; // username or email
  string password = 2;
}

message PasskeyRequest {
  string credential_id = 1;
  bytes signature = 2;
  bytes client_data_json = 3;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message User {
  string id = 1;
  string username = 2;
  string avatar_url = 3;
}

message RelationRequest {
  string target_user_id = 1;
}

message UserQuery {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message UserListResponse {
  repeated User users = 1;
  string next_cursor = 2;
}

message PostRequest {
  string content_text = 1;
  repeated string media_urls = 2;
  string visibility = 3; // public, friends, private
}

message PostResponse {
  string post_id = 1;
  int64 created_at = 2;
}

message FeedRequest {
  int32 limit = 1;
  string cursor = 2;
}

message FeedResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
}

message Post {
  string id = 1;
  User author = 2;
  string content_text = 3;
  repeated string media_urls = 4;
  int64 created_at = 5;
  ReactionSummary reactions = 6;
}

message ReactionRequest {
  string target_id = 1;
  string reaction_type = 2; // like, love, etc.
}

message ReactionSummary {
  int32 total_count = 1;
  map<string, int32> type_counts = 2;
}

message ActionResponse {
  bool success = 1;
  string message = 2;
}

message ConnectRequest {
  string session_id = 1;
}

message ServerEvent {
  string event_type = 1;
  bytes payload = 2;
}
