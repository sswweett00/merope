name: merope_ui
description: Design system and UI components for Merope.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4

  merope_core:
    path: ../merope_core

  flutter_staggered_grid_view: ^0.7.0
  flutter_blurhash: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
