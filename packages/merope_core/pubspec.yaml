name: merope_core
description: Core infrastructure for Merope platform.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage & Database (Offline-First)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Networking & Real-Time Communication
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  grpc: ^3.2.0
  protobuf: ^3.1.0

  # Security & Cryptography
  crypto: ^3.0.3
  argon2: ^1.0.1
  encrypt: ^5.0.3

  # Media & RTC
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4

  # Custom Packages
  merope_models:
    path: ../merope_models

  # Data & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
